name: Migrate portfolio contact email

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/migrate-contact-email.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace inactive contact email
        shell: bash
        run: |
          set -euo pipefail
          OLD_EMAIL='abudfun@gmail.com'
          NEW_EMAIL='s-abdallah.ali@zewailcity.edu.eg'

          mapfile -d '' files < <(git grep -Ilz "$OLD_EMAIL" || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No inactive email references remain.'
            exit 0
          fi

          for file in "${files[@]}"; do
            sed -i "s/${OLD_EMAIL//./\.}/${NEW_EMAIL}/g" "$file"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'Replace inactive contact email with university email'
          git push

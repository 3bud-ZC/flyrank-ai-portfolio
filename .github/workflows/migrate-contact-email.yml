name: Migrate portfolio contact email

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/migrate-contact-email.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace inactive contact email on a migration branch
        shell: bash
        run: |
          set -euo pipefail
          OLD_EMAIL='abudfun''@gmail.com'
          NEW_EMAIL='s-abdallah.ali@zewailcity.edu.eg'
          BRANCH='chore/use-university-contact-email'

          git checkout -B "$BRANCH"

          python - <<'PY'
          from pathlib import Path

          old = 'abudfun' + '@gmail.com'
          new = 's-abdallah.ali@zewailcity.edu.eg'
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(path))

          print(f'Changed {len(changed)} file(s):')
          for item in changed:
              print(f'- {item}')

          if not changed:
              raise SystemExit('No inactive email references were found.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src docs
          git commit -m 'Replace inactive contact email with university email'
          git push --force origin "HEAD:$BRANCH"
